name: Bug report
description: Report a reproducible defect in a supported node or maintained workflow.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Include enough information to reproduce the problem. Remove private paths, prompts, images, and credentials before submitting.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: I am using a node ID documented in docs/NODE_REFERENCE.md.
          required: true
        - label: I reproduced the issue without unrelated custom nodes when practical.
          required: true
        - label: This is not a security vulnerability; security reports follow SECURITY.md.
          required: true
  - type: input
    id: extension-version
    attributes:
      label: Extension version or commit
      placeholder: 1.0.0b1 or commit SHA
    validations:
      required: true
  - type: input
    id: comfyui-version
    attributes:
      label: ComfyUI version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, GPU, VRAM, driver, loader, checkpoint, text encoder, VAE, precision/quantization.
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Workflow and settings
      description: Sampler, scheduler, steps, guidance, resolution, seed, references, masks, and relevant node values.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Load...
        2. Connect...
        3. Queue...
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Complete traceback or logs
      render: shell
  - type: textarea
    id: architecture-report
    attributes:
      label: Architecture Inspector output
      description: Required for loader, quantization, attention-hook, or reference-metadata issues.
      render: json
  - type: textarea
    id: additional
    attributes:
      label: Additional context
