[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ComfyUI-Flux2Dev-Enhancer"
description = "Architecture-aware conditioning, reference, identity-transfer, and latent-guidance nodes for the open-weight FLUX.2 family in ComfyUI"
version = "1.0.0b1"
requires-python = ">=3.10"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Jader Vasque" },
]
maintainers = [
    { name = "Jader Vasque" },
]
keywords = ["comfyui", "flux2", "image-generation", "identity-transfer", "conditioning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.urls]
Repository = "https://github.com/jadervasque/ComfyUI-Flux2Dev-Enhancer"
Documentation = "https://github.com/jadervasque/ComfyUI-Flux2Dev-Enhancer#readme"
"Bug Tracker" = "https://github.com/jadervasque/ComfyUI-Flux2Dev-Enhancer/issues"

[tool.setuptools.packages.find]
include = ["comfyui_flux2dev_enhancer*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.comfy]
PublisherId = "jadervasque"
DisplayName = "ComfyUI-Flux2Dev-Enhancer"
Icon = ""
includes = []
