[project]
name = "ComfyUI-Flux2-Enhancer"
description = "Architecture-aware conditioning, reference, identity-transfer, and latent-guidance nodes for the open-weight FLUX.2 family in ComfyUI"
version = "4.0.0"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "capitan01R", role = "Original project author" },
    { name = "Jader Vasque", role = "Multi-variant fork maintainer" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/jadervasque/ComfyUI-Flux2Dev-Enhancer"
Documentation = "https://github.com/jadervasque/ComfyUI-Flux2Dev-Enhancer#readme"
"Bug Tracker" = "https://github.com/jadervasque/ComfyUI-Flux2Dev-Enhancer/issues"
Upstream = "https://github.com/capitan01R/ComfyUI-Flux2Klein-Enhancer"

[tool.comfy]
PublisherId = "jadervasque"
DisplayName = "ComfyUI FLUX.2 Enhancer"
Icon = ""
includes = []
